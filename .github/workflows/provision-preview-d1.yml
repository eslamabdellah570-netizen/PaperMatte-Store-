name: Provision preview D1 database

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-preview-d1:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create isolated D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret first."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Add the CLOUDFLARE_ACCOUNT_ID repository variable first."
            exit 1
          fi
          npx --yes wrangler@4 d1 create papermatte-preview
