 <radialGradient id="purple"><stop stop-color="#7835d6" stop-opacity=".62"/><stop offset="1" stop-color="#7835d6" stop-opacity="0"/></radialGradient>
 <radialGradient id="blue"><stop stop-color="#126bdb" stop-opacity=".35"/><stop offset="1" stop-color="#126bdb" stop-opacity="0"/></radialGradient>
 <linearGradient id="case" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#34405b"/><stop offset=".55" stop-color="#202c43"/><stop offset="1" stop-color="#111b2e"/></linearGradient>
 <linearGradient id="caseEdge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a6b2d0"/><stop offset=".45" stop-color="#5c6d91"/><stop offset="1" stop-color="#328aff"/></linearGradient>
