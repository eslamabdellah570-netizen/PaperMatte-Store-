<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080910"><meta name="description" content="تفاصيل المنتج من PaperMatte Store"><link rel="preconnect" href="https://appabnyalsnlqytnklzr.supabase.co"><link rel="dns-prefetch" href="//cdn.jsdelivr.net"><title>تفاصيل المنتج | PaperMatte Store</title>
<style>@view-transition{navigation:auto}::view-transition-old(root){animation:page-out .16s ease both}::view-transition-new(root){animation:page-in .28s ease both}@keyframes page-in{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}@keyframes page-out{to{opacity:0}}main{animation:page-in .32s ease both}#content>.notice{animation:page-in .22s ease both}@media(prefers-reduced-motion:reduce){::view-transition-old(root),::view-transition-new(root),main{animation:none}}@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap');*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% -10%,#35105c88,transparent 36%),#080910;color:#f7f7fc;font-family:Cairo,Tahoma,Arial,sans-serif;line-height:1.7}a{color:inherit;text-decoration:none}.wrap{width:min(1050px,92%);margin:auto}header{border-bottom:1px solid #ffffff18;background:#090a12e8}.nav{height:74px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;font-size:19px}.back{padding:9px 14px;border:1px solid #292d42;border-radius:11px;color:#d8c3ff}main{padding:42px 0}.product{display:grid;grid-template-columns:1fr 1fr;gap:35px;align-items:start;background:linear-gradient(145deg,#171a29,#10121d);border:1px solid #292d42;border-radius:25px;padding:22px}.photo{min-height:360px;border-radius:18px;background:radial-gradient(circle at 50% 42%,#34305d,#171a2b 68%);display:grid;place-items:center;overflow:hidden}.photo img{width:100%;height:420px;object-fit:contain;padding:15px}.kicker{color:#c39aff;font-size:12px;font-weight:800;letter-spacing:1px}.details{padding:12px 5px}.details h1{font-size:clamp(27px,4vw,40px);line-height:1.3;margin:8px 0}.description{color:#c8cada;display:flex;flex-direction:column;align-items:stretch;gap:14px;margin:24px 0 28px}.description-line{display:block;width:100%;padding:13px 17px;background:linear-gradient(110deg,#ffffff0b,#ffffff05);border:1px solid #ffffff16;border-right:3px solid #a56bff;border-radius:13px;line-height:1.9;text-align:right;direction:rtl;unicode-bidi:plaintext;font-size:16px;box-shadow:0 5px 16px #00000018}.description-line:first-child{color:#e3d2ff;font-weight:800;background:linear-gradient(110deg,#a56bff18,#ffffff07)}@media(max-width:700px){.description{gap:12px;margin:20px 0 24px}.description-line{padding:12px 14px;font-size:15px;line-height:1.85}}.description-line{display:block;padding:9px 13px;background:#ffffff08;border:1px solid #ffffff10;border-radius:10px;line-height:1.8;unicode-bidi:plaintext;direction:auto}.price-label{color:#a7abc0;font-size:12px;margin-top:25px}.price{font-size:30px;font-weight:900;margin-bottom:22px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{display:inline-flex;justify-content:center;align-items:center;padding:12px 18px;border-radius:12px;font-weight:800;color:#fff;font-family:inherit;cursor:pointer}.buy{background:linear-gradient(110deg,#9d4dff,#347cff)}.share{background:#22263a;border:1px solid #3a405d}.notice,.error{color:#b7bbce;text-align:center;padding:20px}.error{background:#281b28;border:1px solid #75405b;border-radius:14px}@media(max-width:700px){main{padding:22px 0}.product{grid-template-columns:1fr;padding:13px;gap:12px}.photo{min-height:260px}.photo img{height:290px}.details{padding:8px}}</style></head><body><header><div class="wrap nav"><a class="brand" href="index.html">PaperMatte Store</a><a class="back" href="index.html">العودة للمتجر ←</a></div></header><main class="wrap"><div id="content"><p class="notice">جاري تحميل تفاصيل المنتج...</p></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=window.supabase.createClient("https://appabnyalsnlqytnklzr.supabase.co","sb_publishable_GUeyao4IsHv8G25Pfnx8nQ_bTDfah9N");
const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async()=>{const id=new URLSearchParams(location.search).get('id');if(!id||!/^[0-9a-f-]{36}$/i.test(id)){document.getElementById('content').innerHTML='<div class="error">رابط المنتج غير صحيح. <a href="index.html">ارجع للمتجر</a></div>';return}
const {data:p,error}=await sb.from('products').select('id,name,description,price,image_url,category,is_active').eq('id',id).eq('product_type','product').maybeSingle();
if(error||!p||!p.is_active){document.getElementById('content').innerHTML='<div class="error">المنتج غير متاح أو لم يعد موجوداً. <a href="index.html">تصفح منتجات المتجر</a></div>';return}
const message=encodeURIComponent('السلام عليكم، مهتم بـ '+p.name+' بسعر '+Number(p.price).toLocaleString('en-US')+' جنيه. ممكن تفاصيل التوافر والطلب؟');document.title=p.name+' | PaperMatte Store';document.querySelector('meta[name="description"]').content=p.name+' — '+(p.description||'متاح الآن من PaperMatte Store');
document.getElementById('content').innerHTML='<article class="product"><div class="photo">'+(p.image_url?'<img src="'+safe(p.image_url)+'" alt="'+safe(p.name)+'">':'<span>PaperMatte Store</span>')+'</div><div class="details"><div class="kicker">PAPERMATTE STORE</div><h1>'+safe(p.name)+'</h1><div class="description">'+(p.description||'متاح الآن من PaperMatte Store').split(/\r?\n/).filter(Boolean).map(line=>'<div class="description-line" dir="auto">'+safe(line)+'</div>').join('')+'</div><div class="price-label">السعر</div><div class="price">'+Number(p.price||0).toLocaleString('en-US')+' ج.م</div><div class="actions"><a class="btn buy" href="https://wa.me/201024915343?text='+message+'" target="_blank" rel="noopener">اطلب الآن عبر واتساب ↗</a><button class="btn share" id="shareBtn">مشاركة المنتج</button></div></div></article>';
document.getElementById('shareBtn').addEventListener('click',async()=>{const url=location.href;try{if(navigator.share)await navigator.share({title:p.name,url});else{await navigator.clipboard.writeText(url);alert('تم نسخ رابط المنتج')}}catch(e){if(e.name!=='AbortError')prompt('انسخ رابط المنتج:',url)}});
})();</script></body></html>
