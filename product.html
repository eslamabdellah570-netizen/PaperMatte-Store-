<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=window.supabase.createClient("https://appabnyalsnlqytnklzr.supabase.co","sb_publishable_GUeyao4IsHv8G25Pfnx8nQ_bTDfah9N");
const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function formatSpecs(description){
 const raw=String(description||'متاح الآن من PaperMatte Store').trim();
 let lines=raw.split(/\r?\n/).map(line=>line.trim()).filter(Boolean);
 if(lines.length===1){
  lines=raw.split(/,\s*|\.\s+(?=[A-Z])/).map(line=>line.trim()).filter(Boolean);
 }
 return lines.map(line=>{
  line=line.replace(/^[•▪-]\s*/,'').trim();
  return '<div class="description-line" dir="auto">'+safe(line)+'</div>';
 }).join('');
}

(async()=>{const id=new URLSearchParams(location.search).get('id');if(!id||!/^[0-9a-f-]{36}$/i.test(id)){document.getElementById('content').innerHTML='<div class="error">رابط المنتج غير صحيح. <a href="index.html">ارجع للمتجر</a></div>';return}
const {data:p,error}=await sb.from('products').select('id,name,description,price,image_url,category,is_active').eq('id',id).eq('product_type','product').maybeSingle();
if(error||!p||!p.is_active){document.getElementById('content').innerHTML='<div class="error">المنتج غير متاح أو لم يعد موجوداً. <a href="index.html">تصفح منتجات المتجر</a></div>';return}
const message=encodeURIComponent('السلام عليكم، مهتم بـ '+p.name+' بسعر '+Number(p.price).toLocaleString('en-US')+' جنيه. ممكن تفاصيل التوافر والطلب؟');document.title=p.name+' | PaperMatte Store';
const seoDescription=(p.name+' — '+(p.description||'متاح الآن من PaperMatte Store')).replace(/\s+/g,' ').slice(0,300);
document.querySelector('meta[name="description"]').content=seoDescription;
const canonicalUrl=location.origin+location.pathname+'?id='+encodeURIComponent(p.id);
let canonical=document.querySelector('link[rel="canonical"]');
if(!canonical){canonical=document.createElement('link');canonical.rel='canonical';document.head.appendChild(canonical);}
canonical.href=canonicalUrl;
const setOg=(property,content)=>{let tag=document.querySelector('meta[property="'+property+'"]');if(!tag){tag=document.createElement('meta');tag.setAttribute('property',property);document.head.appendChild(tag);}tag.content=content;};
setOg('og:title',document.title);setOg('og:description',seoDescription);setOg('og:url',canonicalUrl);if(p.image_url)setOg('og:image',p.image_url);
const productSchema={"@context":"https://schema.org","@type":"Product",name:p.name,description:seoDescription,sku:String(p.id),image:p.image_url?[p.image_url]:undefined,offers:{"@type":"Offer",url:canonicalUrl,price:String(Number(p.price||0)),priceCurrency:"EGP",seller:{"@type":"Organization",name:"PaperMatte Store"}}};
const schemaScript=document.createElement('script');schemaScript.type='application/ld+json';schemaScript.textContent=JSON.stringify(productSchema);document.head.appendChild(schemaScript);
document.getElementById('content').innerHTML='<article class="product"><div class="photo">'+(p.image_url?'<img src="'+safe(p.image_url)+'" alt="'+safe(p.name)+'">':'<span>PaperMatte Store</span>')+'</div><div class="details"><div class="kicker">PAPERMATTE STORE</div><h1>'+safe(p.name)+'</h1><div class="description">'+formatSpecs(p.description||'متاح الآن من PaperMatte Store')+'</div><div class="purchase-points"><span>⚡ الدفع عند الاستلام</span><span>⚡ متاح معاينة المنتج قبل الاستلام</span></div><a class="cheaper-note" href="https://wa.me/201024915343?text='+encodeURIComponent('السلام عليكم، لقيت المنتج '+p.name+' بسعر أرخص وعايز أبلغكم.')+'" target="_blank" rel="noopener">لو لقيت المنتج ده بسعر أرخص برا بلغنا 🤍</a><div class="price-label">السعر</div><div class="price">'+Number(p.price||0).toLocaleString('en-US')+' ج.م</div><div class="actions"><a class="btn buy" href="https://wa.me/201024915343?text='+message+'" target="_blank" rel="noopener">اطلب الآن عبر واتساب ↗</a><button class="btn share" id="shareBtn">مشاركة المنتج</button></div></div></article>';
document.getElementById('shareBtn').addEventListener('click',async()=>{const url=location.href;try{if(navigator.share)await navigator.share({title:p.name,url});else{await navigator.clipboard.writeText(url);alert('تم نسخ رابط المنتج')}}catch(e){if(e.name!=='AbortError')prompt('انسخ رابط المنتج:',url)}});
})();</script></body></html>
